<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>REIMTAKT</title>

<!-- Home-Bildschirm Icons & Manifest -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="manifest" href="manifest.json">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14110F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#14110F;
    --bg-panel:#1E1A17;
    --bg-panel-2:#252019;
    --amber:#E8A33D;
    --amber-dim:#8a6427;
    --red:#D64545;
    --cream:#F3EEE3;
    --muted:#8C8378;
    --line:#332C25;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    background:
      radial-gradient(circle at 50% -10%, #24201a 0%, var(--bg-deep) 55%),
      repeating-radial-gradient(circle at 50% 50%, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 2px, transparent 4px);
    color:var(--cream);
    font-family:'Space Grotesk', sans-serif;
    overflow:hidden;
    height:100dvh;
    -webkit-user-select:none; user-select:none;
  }
  .app{
    height:100dvh; height:100vh;
    display:flex; flex-direction:column;
    padding: max(18px, env(safe-area-inset-top)) 20px max(18px, env(safe-area-inset-bottom));
    max-width:520px; margin:0 auto;
  }
  header{
    display:flex; align-items:baseline; justify-content:space-between;
    flex-shrink:0;
  }
  .eyebrow{
    font-size:11px; letter-spacing:0.28em; color:var(--amber);
    font-weight:600; text-transform:uppercase;
  }
  .brand{
    font-size:15px; letter-spacing:0.05em; font-weight:700; color:var(--muted);
  }
  .brand b{color:var(--cream);}

  .stage{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:6px; min-height:0; position:relative;
  }

  /* bounce zone */
  .bounceZone{
    position:relative; width:100%; height:100px; flex-shrink:0;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .ball{
    position:absolute; left:0; bottom:0; width:26px; height:26px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #fbe3b8, var(--amber) 55%, var(--amber-dim) 100%);
    box-shadow: 0 0 18px 2px rgba(232,163,61,0.55), 0 4px 10px rgba(0,0,0,0.5);
    will-change: transform;
  }
  .groundLine{
    position:absolute; bottom:0; left:8%; right:8%; height:2px;
    background:linear-gradient(90deg, transparent, var(--line) 15%, var(--line) 85%, transparent);
  }
  .pegs{
    position:absolute; bottom:-2px; left:0; right:0;
    display:flex; justify-content:space-between; padding:0 8%;
  }
  .peg{
    width:8px; height:8px; margin-bottom:-3px; border-radius:50%;
    background:var(--bg-panel-2); border:1.5px solid var(--line);
    transition:transform .08s ease, background .08s ease, border-color .08s ease, box-shadow .08s ease;
  }
  .peg.hit{
    background:var(--amber); border-color:var(--amber);
    box-shadow:0 0 10px 2px rgba(232,163,61,0.6);
    transform:scale(1.35);
  }
  .peg.hit.downbeat{
    background:var(--red); border-color:var(--red);
    box-shadow:0 0 12px 3px rgba(214,69,69,0.65);
  }

  /* word card */
  .wordWrap{
    width:100%; flex:1; display:flex; align-items:center; justify-content:center;
    min-height:0; padding: 10px 0;
  }
  .card{
    position:relative; width:100%; text-align:center; padding: 22px 10px;
  }
  .cardLabel{
    font-size:11px; letter-spacing:0.24em; text-transform:uppercase; color:var(--muted);
    margin-bottom:6px; font-weight:600;
  }
  .word{
    font-family:'Anton', sans-serif;
    font-size: clamp(38px, 13vw, 68px);
    line-height:0.95;
    letter-spacing:0.01em;
    text-transform:uppercase;
    color:var(--cream);
    text-shadow: 0 0 26px rgba(232,163,61,0.18);
    word-break:break-word;
  }
  .word.stamp{ animation: stampIn .32s cubic-bezier(.2,1.4,.4,1); }
  @keyframes stampIn{
    0%{ transform:scale(1.5) rotate(-3deg); opacity:0; filter:blur(2px); }
    60%{ transform:scale(0.97) rotate(0.5deg); opacity:1; filter:blur(0); }
    100%{ transform:scale(1) rotate(0deg); }
  }
  .idleHint{
    color:var(--muted); font-size:14px; letter-spacing:0.02em; line-height:1.5;
  }

  .preview{
    flex-shrink:0; width:100%; padding-bottom:4px;
  }
  .preview .lbl{
    font-size:10px; letter-spacing:0.22em; text-transform:uppercase; color:var(--muted);
    font-weight:600; margin-bottom:8px; text-align:center;
  }
  .previewRow{
    display:flex; gap:8px; justify-content:center;
  }
  .chip{
    flex:1; max-width:110px; background:var(--bg-panel); border:1px solid var(--line);
    border-radius:10px; padding:8px 6px; text-align:center; min-width:0;
  }
  .chip .n{
    font-size:9px; color:var(--amber); font-weight:700; letter-spacing:0.08em; margin-bottom:3px;
  }
  .chip .w{
    font-size:12.5px; font-weight:600; color:var(--cream);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .chip:nth-child(1){ opacity:0.95; }
  .chip:nth-child(2){ opacity:0.75; }
  .chip:nth-child(3){ opacity:0.58; }
  .chip:nth-child(4){ opacity:0.42; }

  .barCount{
    font-size:12px; color:var(--muted); letter-spacing:0.1em; margin-top:2px;
  }
  .barCount b{ color:var(--amber); font-weight:700; }

  /* controls */
  .controls{
    flex-shrink:0; display:flex; flex-direction:column; gap:14px; padding-top:8px;
  }
  .row{ display:flex; align-items:center; gap:12px; }

  .bpmRow{
    background:var(--bg-panel); border:1px solid var(--line); border-radius:14px;
    padding:12px 16px;
  }
  .bpmRow .top{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; }
  .bpmRow .top .lbl{ font-size:11px; letter-spacing:0.18em; text-transform:uppercase; color:var(--muted); font-weight:600; }
  .bpmRow .top .val{ font-size:20px; font-weight:700; color:var(--cream); font-variant-numeric:tabular-nums; }
  .bpmRow .top .val span{ font-size:12px; color:var(--muted); font-weight:500; margin-left:3px; }
  input[type=range]{
    -webkit-appearance:none; width:100%; height:4px; border-radius:2px;
    background:var(--line); outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:20px; height:20px; border-radius:50%;
    background:var(--amber); border:3px solid var(--bg-panel);
    box-shadow:0 0 0 1px var(--amber);
    cursor:pointer;
  }

  .toggleRow{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--bg-panel); border:1px solid var(--line); border-radius:14px;
    padding:12px 16px;
  }
  .toggleRow .lbl{ font-size:13px; font-weight:600; color:var(--cream); }
  .toggleRow .sub{ font-size:11px; color:var(--muted); margin-top:1px; }
  .switch{
    width:46px; height:27px; border-radius:14px; background:var(--line);
    position:relative; flex-shrink:0; transition:background .15s ease; cursor:pointer;
    border:1px solid transparent;
  }
  .switch.on{ background:var(--amber-dim); border-color:var(--amber); }
  .switch::after{
    content:''; position:absolute; top:2px; left:2px; width:21px; height:21px; border-radius:50%;
    background:var(--muted); transition:transform .15s ease, background .15s ease;
  }
  .switch.on::after{ transform:translateX(19px); background:var(--amber); }

  .mainBtn{
    border:none; border-radius:16px; padding:18px; font-family:inherit;
    font-size:16px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase;
    cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px;
    background: linear-gradient(180deg, var(--amber), #c9822a);
    color:#1b1206;
    box-shadow: 0 6px 18px rgba(232,163,61,0.28), inset 0 1px 0 rgba(255,255,255,0.35);
    transition: transform .08s ease;
  }
  .mainBtn:active{ transform:scale(0.97); }
  .mainBtn.stop{
    background: linear-gradient(180deg, #3a332b, #241f19);
    color:var(--cream);
    box-shadow: inset 0 0 0 1px var(--line);
  }
  .mainBtn .icon{ width:14px; height:14px; }

  .skipRow{ display:flex; justify-content:center; }
  .skipBtn{
    background:none; border:1px solid var(--line); color:var(--muted);
    border-radius:20px; padding:8px 18px; font-family:inherit; font-size:12px;
    letter-spacing:0.08em; text-transform:uppercase; font-weight:600; cursor:pointer;
  }
  .skipBtn:active{ background:var(--bg-panel); }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <div class="eyebrow">Freestyle Trainer</div>
      <div class="brand"><b>REIM</b>TAKT</div>
    </div>
    <div class="barCount" id="barCount">&nbsp;</div>
  </header>

  <div class="stage">
    <div class="bounceZone">
      <div class="groundLine"></div>
      <div class="pegs" id="pegs">
        <div class="peg"></div><div class="peg"></div><div class="peg"></div><div class="peg"></div>
      </div>
      <div class="ball" id="ball"></div>
    </div>

    <div class="wordWrap">
      <div class="card">
        <div class="cardLabel" id="cardLabel">Bereit</div>
        <div class="word" id="word">Start drücken</div>
      </div>
    </div>

    <div class="preview">
      <div class="lbl">Nächste Wörter</div>
      <div class="previewRow" id="previewRow">
        <div class="chip"><div class="n">TAKT +1</div><div class="w">–</div></div>
        <div class="chip"><div class="n">TAKT +2</div><div class="w">–</div></div>
        <div class="chip"><div class="n">TAKT +3</div><div class="w">–</div></div>
        <div class="chip"><div class="n">TAKT +4</div><div class="w">–</div></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <div class="bpmRow">
      <div class="top">
        <span class="lbl">Tempo</span>
        <span class="val"><span id="bpmVal">90</span><span>BPM</span></span>
      </div>
      <input type="range" id="bpmSlider" min="60" max="150" value="90" step="1">
    </div>

    <div class="toggleRow" id="soundRow">
      <div>
        <div class="lbl">Taktklick</div>
        <div class="sub">Ton bei jedem Schlag</div>
      </div>
      <div class="switch on" id="soundSwitch"></div>
    </div>

    <div class="row">
      <button class="mainBtn" id="mainBtn">
        <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        Start
      </button>
    </div>
    <div class="skipRow">
      <button class="skipBtn" id="skipBtn">Nächstes Wort ⟳</button>
    </div>
  </div>
</div>

<script>
(function(){
  // ---------- Wortpool ----------
  const WORDS = [
    // Substantive
    "Freiheit","Straße","Feuer","Schatten","Wahnsinn","Herzschlag","Bewegung","Ferne",
    "Nacht","Sonne","Wolke","Regen","Sturm","Stille","Lärm","Rhythmus",
    "Traum","Wirklichkeit","Zukunft","Vergangenheit","Moment","Ewigkeit","Anfang","Ende",
    "Wahrheit","Lüge","Spiegel","Fenster","Straßenlicht","Beton","Asphalt","Wolkenkratzer",
    "Krone","Thron","Kämpfer","Krieger","Legende","Geschichte","Erinnerung","Narbe",
    "Mut","Angst","Stolz","Ehre","Respekt","Loyalität","Verrat","Vertrauen",
    "Familie","Freundschaft","Liebe","Herzschmerz","Sehnsucht","Nähe","Distanz","Einsamkeit",
    "Reichtum","Armut","Hunger","Durst","Gier","Neid","Wut","Ruhe",
    "Geld","Gold","Diamant","Uhr","Zeit","Sekunde","Minute","Stadt",
    "Dorf","Straßenecke","Hinterhof","Dach","Keller","Balkon","Fahrstuhl","Musik",
    "Beat","Mikrofon","Bühne","Applaus","Echo","Stimme","Melodie","Reim",
    "Silbe","Zeile","Vers","Strophe","Flow","Punchline","Wortspiel","Wind",
    "Regenbogen","Blitz","Donner","Nebel","Frost","Hitze","Kälte","Vogel",
    "Wolf","Löwe","Adler","Schlange","Drache","Phönix","Tiger","Weg",
    "Reise","Ziel","Richtung","Kompass","Karte","Horizont","Grenze","Kraft",
    "Energie","Schwäche","Stärke","Balance","Chaos","Ordnung","Harmonie","Spiegelbild",
    "Maske","Gesicht","Blick","Lächeln","Träne","Wunde","Heilung","Feuerwerk",
    "Rauch","Asche","Funken","Flamme","Glut","Licht","Dunkelheit","Krieg",
    "Frieden","Waffe","Schild","Schlacht","Sieg","Niederlage","Kampf","Straßenkind",
    "König","Königin","Rebell","Außenseiter","Held","Schurke","Fremder","Herz",
    "Seele","Verstand","Gedanke","Gefühl","Instinkt","Intuition","Bauchgefühl","Schritt",
    "Sprung","Fall","Aufstieg","Höhe","Tiefe","Abgrund","Gipfel","Meer",
    "Welle","Strand","Insel","Fluss","See","Quelle","Ozean","Wurzel",
    "Baum","Ast","Blatt","Blüte","Frucht","Samen","Erde","Schmerz",
    "Glück","Chance","Risiko","Schicksal","Zufall","Plan","Prüfung","Versuchung",
    "Käfig","Flügel","Krallen","Blitzlicht","Spiegelung","Puls","Adrenalin","Rausch",
    "Sucht","Befreiung","Aufbruch","Ankunft","Abschied","Wiedersehen","Zweifel","Hoffnung",
    "Verzweiflung","Widerstand","Rebellion","Revolution","Generation","Erbe","Vermächtnis","Spur",
    "Fußabdruck","Klang","Vibration","Frequenz","Puzzle","Rätsel","Labyrinth","Tunnel",
    "Brücke","Abgrundtiefe","Wüste","Oase","Vulkan","Lava","Eiszeit","Sternenhimmel",
    "Mondlicht","Finsternis","Dämmerung","Morgenrot","Takt","Groove","Vibe","Feingefühl",
    // Adjektive
    "Spiegelglatt","Glasklar","Bodenlos","Grenzenlos","Zeitlos","Endlos","Namenlos","Rastlos",
    "Stark","Schwach","Wild","Ruhig","Laut","Leise","Hart","Weich",
    "Kalt","Heiß","Hell","Dunkel","Schnell","Langsam","Echt","Falsch",
    "Ehrlich","Verlogen","Frei","Gefangen","Souverän","Bescheiden","Mutig","Ängstlich",
    "Verrückt","Klar","Verschwommen","Kurz","Tief","Flach","Scharf","Stumpf",
    "Golden","Silbern","Pur","Roh","Brutal","Sanft","Zerbrechlich","Unzerstörbar",
    "Einsam","Verbunden","Nah","Fern","Jung","Alt","Neu","Vergänglich",
    "Ewig","Gefährlich","Sicher","Wach","Müde","Hungrig","Satt","Arm",
    "Reich","Leer","Voll","Schwer","Leicht","Still","Chaotisch","Geordnet",
    "Wütend","Gelassen","Ungebeugt","Unaufhaltsam","Skrupellos","Loyal","Eiskalt","Feurig","Ruhelos",
    // Verben
    "Fliegen","Brennen","Kämpfen","Träumen","Glauben","Hoffen","Lieben","Hassen",
    "Laufen","Tanzen","Singen","Schreien","Flüstern","Lachen","Weinen","Denken",
    "Fühlen","Leben","Sterben","Atmen","Springen","Fallen","Steigen","Sinken",
    "Gewinnen","Verlieren","Bauen","Zerstören","Heilen","Verletzen","Vergessen","Erinnern",
    "Warten","Suchen","Finden","Verstecken","Zeigen","Folgen","Führen","Brechen",
    "Wachsen","Verändern","Bleiben","Verschwinden","Erscheinen","Erwachen","Siegen","Scheitern",
    "Durchhalten","Aufgeben","Glänzen","Funkeln","Explodieren","Schweben","Rasen","Jagen",
    "Fliehen","Standhalten","Überleben","Riskieren","Wagen","Zweifeln","Erobern","Beherrschen"
  ];

  // Zieh-Sack ohne direkte Wiederholung
  let bag = [];
  function refillBag(){
    bag = [...WORDS];
    for(let i = bag.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [bag[i], bag[j]] = [bag[j], bag[i]];
    }
  }
  function nextWord(){
    if(bag.length === 0) refillBag();
    return bag.pop();
  }

  // ---------- DOM ----------
  const ball = document.getElementById('ball');
  const pegs = [...document.querySelectorAll('.peg')];
  const wordEl = document.getElementById('word');
  const cardLabel = document.getElementById('cardLabel');
  const barCountEl = document.getElementById('barCount');
  const previewChips = [...document.querySelectorAll('#previewRow .chip .w')];
  const bpmSlider = document.getElementById('bpmSlider');
  const bpmVal = document.getElementById('bpmVal');
  const soundSwitch = document.getElementById('soundSwitch');
  const mainBtn = document.getElementById('mainBtn');
  const skipBtn = document.getElementById('skipBtn');
  const bounceZone = document.querySelector('.bounceZone');

  let pegXs = [0,0,0,0];
  function computePegX(){
    const zoneRect = bounceZone.getBoundingClientRect();
    const ballHalf = ball.offsetWidth / 2;
    pegXs = pegs.map(p => {
      const r = p.getBoundingClientRect();
      return (r.left + r.width/2) - zoneRect.left - ballHalf;
    });
  }
  window.addEventListener('resize', computePegX);
  window.addEventListener('orientationchange', () => setTimeout(computePegX, 200));
  window.addEventListener('load', () => {
    computePegX();
    ball.style.transform = `translate(${pegXs[0]}px, 0px)`;
  });

  function easeInOut(t){ return t*t*(3 - 2*t); } // smoothstep, sinusförmiger Charakter
  let bpm = 90;
  let soundOn = true;
  let running = false;
  let barNumber = 0;

  bpmSlider.addEventListener('input', () => {
    bpm = parseInt(bpmSlider.value, 10);
    bpmVal.textContent = bpm;
  });

  soundSwitch.addEventListener('click', () => {
    soundOn = !soundOn;
    soundSwitch.classList.toggle('on', soundOn);
  });

  // ---------- Audio-Uhr Scheduler ----------
  let audioCtx = null;
  let nextBeatTime = 0;   // AudioContext-Zeit des nächsten Schlags
  let beatIndex = 0;      // 0..3 innerhalb des Takts
  let schedulerTimer = null;
  const LOOKAHEAD = 0.12;     // Sekunden voraus planen
  const SCHEDULE_INTERVAL = 25; // ms

  let scheduledBeats = []; // {time, beatIndex}

  function ensureAudio(){
    if(!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if(audioCtx.state === 'suspended') audioCtx.resume();
  }

  function playClick(time, isDownbeat){
    if(!soundOn) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = isDownbeat ? 1100 : 780;
    gain.gain.setValueAtTime(0.0001, time);
    gain.gain.exponentialRampToValueAtTime(isDownbeat ? 0.35 : 0.22, time + 0.005);
    gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.07);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(time);
    osc.stop(time + 0.08);
  }

  function scheduler(){
    const beatDur = 60 / bpm;
    while(nextBeatTime < audioCtx.currentTime + LOOKAHEAD){
      playClick(nextBeatTime, beatIndex === 0);
      scheduledBeats.push({time: nextBeatTime, beatIndex});
      beatIndex = (beatIndex + 1) % 4;
      nextBeatTime += beatDur;
    }
  }

  function startTransport(){
    ensureAudio();
    beatIndex = 0;
    nextBeatTime = audioCtx.currentTime + 0.15;
    scheduledBeats = [];
    barNumber = 0;
    lastBeatTime = nextBeatTime;
    lastBeatIndex = 3; // damit der erste Beat als Übergang zu Index 0 gilt
    hasFirstBeat = false;
    computePegX();
    cardLabel.textContent = 'Bar';
    schedulerTimer = setInterval(scheduler, SCHEDULE_INTERVAL);
    requestAnimationFrame(visualLoop);
  }

  function stopTransport(){
    if(schedulerTimer) clearInterval(schedulerTimer);
    schedulerTimer = null;
  }

  let lastFiredIdx = -1; // fortlaufender Beat-Zähler, um Doppelfeuer zu vermeiden
  let totalBeatsFired = 0;
  let lastBeatTime = 0;
  let lastBeatIndex = 3;
  let hasFirstBeat = false;

  function visualLoop(){
    if(!running) return;
    const now = audioCtx.currentTime;
    const beatDur = 60 / bpm;

    // vergangene, noch nicht visuell ausgelöste Beats abarbeiten
    while(scheduledBeats.length && scheduledBeats[0].time <= now){
      const b = scheduledBeats.shift();
      firePeg(b.beatIndex);
      lastBeatTime = b.time;
      lastBeatIndex = b.beatIndex;
      hasFirstBeat = true;
      totalBeatsFired++;
      if(b.beatIndex === 0){
        barNumber++;
        barCountEl.innerHTML = 'Bar <b>' + barNumber + '</b>';
        if(barNumber === 1){ initWords(); } else { advanceWord(); }
      }
    }

    if(hasFirstBeat){
      const fromIdx = lastBeatIndex;
      const toIdx = (lastBeatIndex + 1) % 4;
      let phase = (now - lastBeatTime) / beatDur;
      if(phase < 0) phase = 0;
      if(phase > 1) phase = 1;

      const xFrom = pegXs[fromIdx];
      const xTo = pegXs[toIdx];
      const x = xFrom + (xTo - xFrom) * easeInOut(phase);

      // Sinusförmiger Hüpfbogen: 0 am Boden bei jedem Punkt, Scheitel dazwischen
      const arc = Math.sin(Math.PI * phase);
      const maxHeight = bounceZone.clientHeight - 30;

      ball.style.transform = `translate(${x}px, ${-arc * maxHeight}px)`;
    }

    requestAnimationFrame(visualLoop);
  }

  function firePeg(idx){
    pegs.forEach(p => p.classList.remove('hit','downbeat'));
    const p = pegs[idx];
    p.classList.add('hit');
    if(idx === 0) p.classList.add('downbeat');
    setTimeout(() => p.classList.remove('hit','downbeat'), 140);
  }

  let currentWord = null;
  let previewQueue = [];

  function renderWord(){
    wordEl.textContent = currentWord;
    wordEl.classList.remove('stamp');
    void wordEl.offsetWidth; // reflow, Animation neu triggern
    wordEl.classList.add('stamp');
  }

  function renderPreview(){
    previewQueue.forEach((w, i) => { previewChips[i].textContent = w; });
  }

  function initWords(){
    currentWord = nextWord();
    previewQueue = [nextWord(), nextWord(), nextWord(), nextWord()];
    renderWord();
    renderPreview();
  }

  function advanceWord(){
    currentWord = previewQueue.shift();
    previewQueue.push(nextWord());
    renderWord();
    renderPreview();
  }

  // ---------- Start/Stop ----------
  function setRunning(state){
    running = state;
    if(state){
      mainBtn.classList.add('stop');
      mainBtn.innerHTML = '<svg class="icon" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg> Stopp';
      cardLabel.textContent = 'Bar';
      startTransport();
    } else {
      mainBtn.classList.remove('stop');
      mainBtn.innerHTML = '<svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg> Start';
      stopTransport();
      hasFirstBeat = false;
      pegs.forEach(p => p.classList.remove('hit','downbeat'));
      computePegX();
      ball.style.transform = `translate(${pegXs[0]}px, 0px)`;
      cardLabel.textContent = 'Pausiert';
    }
  }

  mainBtn.addEventListener('click', () => setRunning(!running));

  skipBtn.addEventListener('click', () => {
    if(currentWord === null) return;
    advanceWord();
  });

})();
</script>
</body>
</html>
